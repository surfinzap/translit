name: Tests

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install -g pnpm

      - run: pnpm install

      # Run tests and extract the passing test count from vitest's summary line
      - name: Run tests and capture output
        id: test_count
        env:
          CI: true
        run: |
          TEST_OUTPUT=$(pnpm test --reporter=default 2>&1)
          echo "$TEST_OUTPUT"
          PASSING_TESTS=$(echo "$TEST_OUTPUT" | grep "Tests" | grep -o '[0-9]\+ passed' | grep -o '[0-9]\+')
          echo "Passing tests: $PASSING_TESTS"
          # Create JSON file with the test count
          echo "{ \"schemaVersion\": 1, \"label\": \"tests\", \"message\": \"$PASSING_TESTS tests passing\", \"color\": \"#157e63\" }" > tests-status.json

      # Commit the updated JSON file back to the repo
      - name: Commit test count JSON
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add tests-status.json
          git commit -m "Update test count"
          git push origin main
        # Prevents workflow from failing if no changes are made
        continue-on-error: true
